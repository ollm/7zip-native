name: Build and publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to npm (requires selecting a matching v<version> tag)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate release tag
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Require a tag matching the package version
        run: |
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const version = JSON.parse(readFileSync("package.json", "utf8")).version;
            if (process.env.GITHUB_REF_NAME !== `v${version}`) {
              throw new Error(`Tag v${version} is required; found ${process.env.GITHUB_REF_NAME}`);
            }
          '

  build:
    needs: validate-release
    if: >-
      !cancelled() &&
      (needs.validate-release.result == 'success' || needs.validate-release.result == 'skipped')
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
            node-arch: x64
          - target: linux-ia32
            runner: ubuntu-24.04
            build-arch: ia32
            node-arch: x64
          - target: linux-arm
            runner: ubuntu-24.04
            build-arch: arm
            node-arch: x64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            node-arch: arm64
          - target: darwin-x64
            runner: macos-15-intel
            node-arch: x64
          - target: darwin-arm64
            runner: macos-15
            node-arch: arm64
          - target: win32-x64
            runner: windows-2025-vs2026
            msvc-arch: x64
            node-arch: x64
          - target: win32-ia32
            runner: windows-2025-vs2026
            build-arch: ia32
            msvc-arch: x86
            node-arch: x64
          - target: win32-arm64
            runner: windows-11-arm
            msvc-arch: arm64
            node-arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          architecture: ${{ matrix.node-arch }}
          cache: npm
      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc-arch }}
      - name: Install Linux cross-compilers
        if: matrix.target == 'linux-ia32' || matrix.target == 'linux-arm'
        run: |
          sudo apt-get update
          if [ "${{ matrix.target }}" = "linux-ia32" ]; then
            sudo apt-get install -y gcc-multilib g++-multilib
          else
            sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
          fi
      - run: npm ci --ignore-scripts
      - run: npm run build
        env:
          BUILD_ARCH: ${{ matrix.build-arch }}
      - run: npm test
        if: matrix.target != 'linux-ia32' && matrix.target != 'linux-arm'
      - name: Verify Linux cross-compiled binaries
        if: matrix.target == 'linux-ia32' || matrix.target == 'linux-arm'
        shell: bash
        run: |
          file prebuilds/${{ matrix.target }}/7zip_native.node prebuilds/${{ matrix.target }}/7z.so
          if [ "${{ matrix.target }}" = "linux-ia32" ]; then
            file prebuilds/${{ matrix.target }}/7zip_native.node | grep -q 'ELF 32-bit.*Intel 80386'
            file prebuilds/${{ matrix.target }}/7z.so | grep -q 'ELF 32-bit.*Intel 80386'
          else
            file prebuilds/${{ matrix.target }}/7zip_native.node | grep -q 'ELF 32-bit.*ARM'
            file prebuilds/${{ matrix.target }}/7z.so | grep -q 'ELF 32-bit.*ARM'
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: prebuild-${{ matrix.target }}
          path: prebuilds/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish package to npm
    needs: [build, validate-release]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: prebuild-*
          path: prebuild-artifacts
      - name: Assemble platform prebuilds
        shell: bash
        run: |
          for target in linux-x64 linux-ia32 linux-arm linux-arm64 darwin-x64 darwin-arm64 win32-x64 win32-ia32 win32-arm64; do
            mkdir -p "prebuilds/$target"
            cp -R "prebuild-artifacts/prebuild-$target/." "prebuilds/$target/"
          done
      - name: Build package and verify release version
        shell: bash
        run: |
          npx rollup -c
          npm run typecheck
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const version = JSON.parse(readFileSync("package.json", "utf8")).version;
            if (process.env.GITHUB_REF_NAME !== `v${version}`) {
              throw new Error(`Tag v${version} is required; found ${process.env.GITHUB_REF_NAME}`);
            }
            for (const target of ["linux-x64", "linux-ia32", "linux-arm", "linux-arm64", "darwin-x64", "darwin-arm64", "win32-x64", "win32-ia32", "win32-arm64"]) {
              const engine = target.startsWith("win32-")
                ? "7z.dll"
                : target.startsWith("darwin-") ? "lib7z.dylib" : "7z.so";
              for (const file of ["7zip_native.node", engine]) {
                readFileSync(`prebuilds/${target}/${file}`);
              }
            }
          '
      - run: npm publish --provenance --access public
