name: Build and publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to npm (requires selecting a matching v<version> tag)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-x64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
          - target: win32-x64
            runner: windows-2025-vs2026
          - target: win32-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: prebuild-${{ matrix.target }}
          path: prebuilds/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish package to npm
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: prebuild-*
          path: prebuild-artifacts
      - name: Assemble platform prebuilds
        shell: bash
        run: |
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64 win32-arm64; do
            mkdir -p "prebuilds/$target"
            cp -R "prebuild-artifacts/prebuild-$target/." "prebuilds/$target/"
          done
      - name: Build package and verify release version
        shell: bash
        run: |
          npx rollup -c
          npm run typecheck
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const version = JSON.parse(readFileSync("package.json", "utf8")).version;
            if (process.env.GITHUB_REF_NAME !== `v${version}`) {
              throw new Error(`Tag v${version} is required; found ${process.env.GITHUB_REF_NAME}`);
            }
            for (const target of ["linux-x64", "linux-arm64", "darwin-x64", "darwin-arm64", "win32-x64", "win32-arm64"]) {
              for (const file of ["7zip_native.node", target.startsWith("win32-") ? "7z.dll" : "7z.so"]) {
                readFileSync(`prebuilds/${target}/${file}`);
              }
            }
          '
      - run: npm publish --provenance --access public
